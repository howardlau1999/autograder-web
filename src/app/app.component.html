<mat-toolbar color="primary" class="top-bar mat-elevation-z6">
  <mat-toolbar-row class="toolbar">
    <span>Autograder</span>
    @if (loggedIn) {
    <a matTooltip="返回主页" routerLink="/courses" mat-icon-button>
      <mat-icon>home</mat-icon>
    </a>
    } @if (loggedIn && isAdmin) {
    <a matTooltip="系统管理" routerLink="/admin" mat-icon-button>
      <mat-icon>settings</mat-icon>
    </a>
    }
    <span class="toolbar-spacer"></span>
    @if (loggedIn) {
    <a matTooltip="账户设置" routerLink="/account" mat-button>
      {{ username }}
      &nbsp;
      <mat-icon>account_circle</mat-icon>
    </a>
    } @if (loggedIn) {
    <button (click)="logout()" matTooltip="退出登录" mat-icon-button>
      <mat-icon aria-hidden="false">logout</mat-icon>
    </button>
    }
  </mat-toolbar-row>
</mat-toolbar>

<router-outlet></router-outlet>
