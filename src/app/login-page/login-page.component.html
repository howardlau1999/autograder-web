<div class="login-card-container">
  <mat-card class="login-card">
    <mat-card-title i18n="login">登录</mat-card-title>
    <mat-card-content>
      <form (ngSubmit)="onSubmit()" [formGroup]="loginForm" class="login-form">
        <mat-form-field class="login-form-control">
          <mat-label i18n="username">用户名/电子邮箱</mat-label>
          <input
            formControlName="username"
            i18n-placeholder="username"
            matInput
            placeholder="用户名"
            required
          />
          <mat-icon matSuffix>account_circle</mat-icon>
          @if (loginForm.get('username')?.invalid) {
          <mat-error> 请输入用户名 </mat-error>
          }
        </mat-form-field>

        <mat-form-field class="login-form-control">
          <mat-label i18n="password">密码</mat-label>
          <input
            formControlName="password"
            i18n-placeholder="password"
            matInput
            placeholder="密码"
            required
            type="password"
          />
          <mat-icon matSuffix>password</mat-icon>
          @if (loginForm.get('password')?.invalid) {
          <mat-error>
            @if (loginForm.get('password')?.hasError('password')) {
            <span>用户名或密码错误</span>
            } @else {
            <span>请输入密码</span>
            }
          </mat-error>
          }
        </mat-form-field>

        <p class="login-button-container">
          <a
            [routerLink]="['/', 'password-reset']"
            class="login-button"
            i18n="forgot-password"
            mat-button
            >忘记密码</a
          >
          <span class="login-button-spacer"></span>
          <a [routerLink]="['/', 'sign-up']" class="login-button" i18n="sign-up" mat-button>注册</a>
          <button
            [disabled]="loggingIn || loginForm.invalid"
            color="primary"
            mat-raised-button
            type="submit"
          >
            @if (!loggingIn) {
            <span class="login-button" i18n="login">登录</span>
            } @if (loggingIn) {
            <span class="login-button" i18n="login">登录中</span>
            }
          </button>
        </p>
      </form>
    </mat-card-content>
  </mat-card>
  <mat-card class="login-card">
    <mat-card-title i18n="third-party-login">第三方登录</mat-card-title>
    <mat-card-content>
      <br />
      <p>
        <a [href]="githubLoginURL" class="one-line-button" i18n="github-login" mat-raised-button>
          <img style="height: 1em" src="assets/github.svg" alt="GitHub Icon" /> 使用 GitHub 登录
        </a>
      </p>
    </mat-card-content>
  </mat-card>
</div>
