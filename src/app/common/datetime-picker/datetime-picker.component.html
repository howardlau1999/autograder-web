<form class="time-select-form">
  <mat-form-field>
    <mat-label>{{ label }}</mat-label>
    <input
      (dateChange)="onDateChange($event)"
      (dateInput)="onDateChange($event)"
      [matDatepicker]="datePicker"
      [value]="timestamp.toJSDate()"
      matInput
      required
    />
    <mat-datepicker-toggle [for]="datePicker" matSuffix></mat-datepicker-toggle>
    <mat-datepicker #datePicker disabled="false"></mat-datepicker>
    @if (error) {
    <mat-error>
      {{ error }}
    </mat-error>
    }
  </mat-form-field>
  &nbsp;
  <mat-form-field class="time-select">
    <mat-select (selectionChange)="onHourChange($event)" [value]="timestamp.hour" placeholder="时">
      @for (hour of hours; track hour) {
      <mat-option [value]="hour">{{ hour.toString().padStart(2, '0') }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  &nbsp;:&nbsp;
  <mat-form-field class="time-select">
    <mat-select
      (selectionChange)="onMinuteChange($event)"
      [value]="timestamp.minute"
      placeholder="分"
    >
      @for (minute of minutes; track minute) {
      <mat-option [value]="minute">{{ minute.toString().padStart(2, '0') }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
  &nbsp;:&nbsp;
  <mat-form-field class="time-select">
    <mat-select
      (selectionChange)="onSecondChange($event)"
      [value]="timestamp.second"
      placeholder="秒"
    >
      @for (second of seconds; track second) {
      <mat-option [value]="second">{{ second.toString().padStart(2, '0') }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</form>
