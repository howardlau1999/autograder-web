<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Autograder</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Values injected by the Go server template (ServerProvidedTokens),
         carried as a JSON data island rather than an inline executable script
         so the CSP needs no 'unsafe-inline'. In dev (ng serve) the template is
         not applied, so the fields keep their literal "{{...}}" placeholder,
         which UserService.readServerConfig treats as unset, falling back to the
         build-time environment. -->
    <script type="application/json" id="server-config">
      { "hcaptchaSiteKey": "{{.HcaptchaSiteKey}}", "githubClientId": "{{.GithubClientId}}" }
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.loli.net" />
    <link
      href="https://fonts.loli.net/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.loli.net/icon?family=Material+Icons" rel="stylesheet" />
    <!-- Copied in as assets, so the critical-CSS inliner must not look for them. -->
    <link href="prism-ghcolors.css" rel="stylesheet" data-beasties-skip />
    <link href="toastui-editor.css" rel="stylesheet" data-beasties-skip />
    <script src="katex.min.js"></script>
    <script src="auto-render.js"></script>
    <script src="prism.js"></script>
    <script src="prism-csharp.min.js"></script>
    <script src="prism-java.min.js"></script>
    <script src="prism-scala.min.js"></script>
    <script src="prism-clike.min.js"></script>
    <script src="prism-c.min.js"></script>
    <script src="prism-cpp.min.js"></script>
  </head>
  <body class="mat-typography">
    <app-root></app-root>
  </body>
</html>
